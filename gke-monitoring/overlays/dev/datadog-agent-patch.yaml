apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: datadog
spec:
  global:
    clusterName: gke-fui-dev-cl
    tags:
      - project:fui
      - region:cl
      - platform:gke
      - cluster_name:gke-fui-dev-cl

  features:
    orchestratorExplorer:
      enabled: true

    apm:
      enabled: true
      hostPortConfig:
        enabled: true
        hostPort: 8126
      # Single Step Instrumentation (SSI): el cluster-agent inyecta automaticamente
      # el trazador en los pods con label admission.datadoghq.com/enabled=true.
      # Solo Python (backends FUI) y solo en los namespaces de apps dev/qa/prod.
      instrumentation:
        enabled: true
        enabledNamespaces:
          - dev
          - qa
          - prod
        libVersions:
          python: latest

    admissionController:
      enabled: true
      mutateUnlabelled: false